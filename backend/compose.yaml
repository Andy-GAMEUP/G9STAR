services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: earthplayground
      POSTGRES_USER: earthplayground
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - earthplayground_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthplayground"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  earthplayground_pg:
