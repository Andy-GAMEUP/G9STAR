<main class="flow-shell member-auth-shell"><div class="flow-heading"><p class="eyebrow">MEMBER ACCOUNT</p><h1 class="page-title">회원가입</h1><p>이메일 인증 후 회원가입을 완료하세요.</p></div><section class="flow-card"><form id="memberSignupForm" class="member-auth-form"><label>가입 아이디 (이메일)<input id="memberEmail" type="email" required maxlength="254" autocomplete="username" placeholder="이메일 주소"></label><button type="button" class="compact-button dark" id="sendVerification">인증번호 발송</button><label>이메일 인증번호<input id="emailCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6자리 인증번호"></label><button type="button" class="compact-button" id="verifyEmail">이메일 인증 확인</button><p id="emailStatus" role="status"></p><label>비밀번호<input id="memberPassword" type="password" required minlength="8" maxlength="200" autocomplete="new-password"></label><small>영문·숫자·특수문자를 포함한 8자 이상</small><label>비밀번호 확인<input id="memberPasswordConfirm" type="password" required minlength="8" maxlength="200" autocomplete="new-password"></label><label>이름 / 상호명 (선택)<input id="memberName" maxlength="100" autocomplete="name"></label><label>연락처 (휴대전화)<input id="memberPhone" type="tel" required autocomplete="tel" placeholder="010-1234-5678"></label><label>추천인 코드<input id="referralCode" required maxlength="100" placeholder="추천받은 코드를 입력하세요"></label><button id="verifyReferral" type="button" class="compact-button">추천인 코드 확인</button><p id="referralResult" role="status"></p><label class="member-consent"><input id="termsConsent" type="checkbox" required> [필수] 이용약관 동의</label><label class="member-consent"><input id="privacyConsent" type="checkbox" required> [필수] 개인정보 수집·이용 동의 (회원 관리 및 서비스 제공을 위한 이메일·연락처 처리)</label><div id="signupChallenge"></div><button class="button primary wide" type="submit">회원가입 완료</button><p id="memberAuthStatus" role="status" aria-live="polite"></p><a href="login.html">이미 가입하셨나요? 로그인</a></form></section></main><script src="app.js"></script><script src="member-auth.js?v=members-20261002"></script></bo
